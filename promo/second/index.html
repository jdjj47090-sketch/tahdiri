<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101719"><title>تحضيري — مستقبلك يبدأ من صفحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#101719;--surface:#182225;--surface2:#202d30;--line:#344448;--ink:#eff7f5;--muted:#b0c0bd;--brand:#55d4c4;--deep:#0f5f5c;--gold:#e0a526}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;gap:14px;padding:16px;background:radial-gradient(ellipse at 50% 22%,#203b3a,var(--bg) 65%);color:var(--ink);font-family:Cairo,'Noto Sans Arabic',Tahoma,sans-serif}.stage{width:min(100%,390px);aspect-ratio:9/16;overflow:hidden;border-radius:22px;box-shadow:0 25px 85px #000a,0 0 0 1px #fff2;background:var(--bg)}canvas{display:block;width:100%;height:100%}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}button{border:0;border-radius:12px;background:var(--brand);color:#062522;padding:12px 24px;font:800 16px Cairo;cursor:pointer}button:disabled{opacity:.6}.hint{margin:0;color:var(--muted);font-size:13px;text-align:center}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style></head>
<body><main><div class="stage"><canvas id="v" width="1080" height="1920" aria-label="إعلان تحضيري: مستقبلك يبدأ من صفحة"></canvas></div><p class="sr">مستقبلك يبدأ من صفحة. كل صفحة تقرّبك لهدفك. ملخصات المواد، أسئلة وزارية موثقة، اختبارات ومراجعة، ومتابعة لتقدّمك. تحضيري — ادرس بذكاء، وتقدّم بثقة.</p><div class="controls"><button id="record">تصدير الفيديو · ٣٥ ثانية</button></div><p class="hint" id="status">1080 × 1920 · اضغط للتصدير واترك الصفحة مفتوحة</p></main>
<script>
(()=>{'use strict';const c=document.querySelector('#v'),x=c.getContext('2d'),btn=document.querySelector('#record'),status=document.querySelector('#status'),W=1080,H=1920,D=35000;const C={bg:'#101719',s:'#182225',s2:'#202d30',line:'#344448',ink:'#eff7f5',muted:'#b0c0bd',brand:'#55d4c4',deep:'#0f5f5c',gold:'#e0a526'};let start=performance.now(),raf;const logo=new Image();logo.src='../../icons/icon.svg';
const scenes=[{a:0,b:5500,k:'open'},{a:5500,b:10500,k:'turn'},{a:10500,b:15500,k:'summ'},{a:15500,b:20500,k:'exam'},{a:20500,b:25500,k:'review'},{a:25500,b:30000,k:'progress'},{a:30000,b:35000,k:'end'}];
const font=(n,w=800)=>`${w} ${n}px Cairo,"Noto Sans Arabic",Tahoma,sans-serif`;
function round(a,b,w,h,r,fill,stroke){x.beginPath();x.roundRect(a,b,w,h,r);x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.lineWidth=2;x.stroke()}}
function txt(t,a,b,size,color=C.ink,align='center',weight=800,max=900){x.save();x.direction='rtl';x.textAlign=align;x.textBaseline='middle';x.font=font(size,weight);x.fillStyle=color;x.shadowColor='#0008';x.shadowBlur=16;x.shadowOffsetY=4;x.fillText(t,a,b,max);x.restore()}
function bg(t){let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#193130');g.addColorStop(.42,C.bg);g.addColorStop(1,'#101a1c');x.fillStyle=g;x.fillRect(0,0,W,H);let glow=x.createRadialGradient(780,500,20,780,500,700);glow.addColorStop(0,'#55d4c425');glow.addColorStop(1,'#55d4c400');x.fillStyle=glow;x.fillRect(0,0,W,H);x.save();x.globalAlpha=.11;x.strokeStyle=C.brand;x.lineWidth=2;for(let i=0;i<10;i++){let y=(i*245-t*.012)%H;x.beginPath();x.moveTo(0,y);x.bezierCurveTo(330,y+90,730,y-90,W,y+30);x.stroke()}x.restore()}
function label(t){round(390,1620,300,54,27,'#55d4c41a');txt(t,540,1647,22,C.brand,'center',700,280)}
function pageCard(y,tilt,alpha,t){x.save();x.globalAlpha=alpha;x.translate(540,y);x.rotate(tilt);x.shadowColor='#0009';x.shadowBlur=38;x.shadowOffsetY=25;round(-330,-230,660,460,20,'#e7ddc6','#fff8');x.shadowColor='transparent';x.fillStyle='#bda978';for(let i=0;i<7;i++)x.fillRect(-280,-140+i*36,555-(i%3)*65,2);txt('الدرس الأول',190,-170,24,'#3c493e','right',700,450);txt('المعادلات',0,0,42,'#33483e','center',800,500);x.restore()}
function device(t,heading,sub,mode){x.save();x.translate(540,1050);x.rotate(-.035+Math.sin(t*.001)*.008);x.shadowColor='#000b';x.shadowBlur=70;x.shadowOffsetY=35;round(-400,-550,800,1100,48,'#111819','#ffffff45');x.shadowColor='transparent';round(-379,-529,758,1058,34,C.bg);round(-379,-529,758,105,'#151f20');txt('تحضيري',260,-477,30,C.ink,'right',800,450);if(logo.complete)x.drawImage(logo,-335,-502,50,50);txt(heading,0,-340,39,C.ink,'center',800,670);txt(sub,0,-285,24,C.muted,'center',600,670);
if(mode==='summary'){round(-320,-210,640,235,20,C.s);txt('ملخص الصفحة ٤٢',250,-165,23,C.brand,'right',700,500);txt('القوانين الأساسية',250,-95,28,C.ink,'right',700,520);txt('•  تعريفات ومفاهيم',250,-32,22,C.muted,'right',600,520);txt('•  أمثلة من الكتاب',250,30,22,C.muted,'right',600,520);round(-320,75,640,160,20,C.s);txt('المادة',240,118,21,C.muted,'right',600);txt('الرياضيات · الفصل الأول',240,184,26,C.ink,'right',700,500)}
if(mode==='exam'){round(-320,-210,640,250,20,C.s);round(135,-175,142,42,21,'#e0a52622');txt('★ وزاري موثّق',205,-154,19,C.gold,'center',700,130);txt('ما ناتج حل المعادلة؟',250,-65,28,C.ink,'right',700,530);for(let i=0;i<3;i++){round(-300,78+i*83,600,62,15,i===1?'#0f5f5c':'#202d30',i===1?C.brand:null);txt(['س = ٥','س = ٧','س = ١٢'][i],210,109+i*83,22,C.ink,'right',600,450)} }
if(mode==='review'){round(-320,-210,640,210,20,C.s);txt('اختبار سريع',250,-155,24,C.brand,'right',700);txt('اختر الإجابة الصحيحة',250,-90,29,C.ink,'right',700,500);round(-300,45,600,72,16,C.s2);txt('تمت الإجابة  ✓',220,81,24,C.brand,'right',700,450);round(-300,150,600,120,16,'#19372b');txt('إجابة صحيحة',205,190,25,'#8ce0b0','right',700,450)}
if(mode==='progress'){round(-320,-210,640,430,20,C.s);txt('تقدّمي الدراسي',250,-160,25,C.ink,'right',700,500);txt('٦٨٪',-220,-72,44,C.brand,'center',900);round(-260,-25,520,13,7,C.s2);round(-260,-25,354,13,7,C.brand);const vs=[.3,.48,.4,.66,.55,.82,.7];vs.forEach((v,i)=>{round(-235+i*68,185-v*175,40,v*175,12,i===5?C.brand:C.deep);txt(['ح','ن','ث','ر','خ','س','ح'][i],-215+i*68,222,16,C.muted,'center',600,40)});txt('صفحات أنجزتها هذا الأسبوع',0,270,20,C.muted,'center',600,580)}
x.restore()}
function draw(now){let elapsed=(now-start)%D,sc=scenes.find(s=>elapsed>=s.a&&elapsed<s.b),p=(elapsed-sc.a)/(sc.b-sc.a);bg(elapsed);let fade=Math.min(1,p*8,(1-p)*8);x.save();x.globalAlpha=fade;
if(sc.k==='open'){pageCard(900,Math.sin(p*2)*.025,1,elapsed);pageCard(875,.08,.24,elapsed);txt('كل صفحة…',540,370,64,C.ink);txt('تقرّبك لهدفك',540,460,74,C.brand);txt('رحلتك الدراسية إلها رفيق',540,1400,29,C.muted,'center',600);label('مستقبلك يبدأ من صفحة')}
if(sc.k==='turn'){pageCard(870,.01*(1-p),1-p*.8,elapsed);for(let i=0;i<24;i++){let a=i*.87+elapsed*.0003,rr=180+(i%6)*60,xx=540+Math.cos(a)*rr,yy=870+Math.sin(a)*rr*1.4;x.globalAlpha=fade*(.18+(i%3)*.12);x.fillStyle=i%4?C.brand:C.gold;x.beginPath();x.arc(xx,yy,3+(i%4),0,Math.PI*2);x.fill()}x.globalAlpha=fade;device(elapsed,'من الكتاب إلى خطة واضحة','موادك وصفحاتك في مكان واحد','summary');txt('من الكتاب…',540,350,48,C.muted);txt('إلى خطوتك الجاية',540,1510,48,C.brand)}
if(sc.k==='summ'){txt('ملخصات المواد',540,350,62,C.ink);txt('الفكرة الأساسية، بوضوح',540,430,27,C.muted,'center',600);device(elapsed,'ملخص الصفحة ٤٢','رياضيات · الفصل الأول','summary');label('افهمها خطوة خطوة')}
if(sc.k==='exam'){txt('أسئلة وزارية',540,350,62,C.ink);txt('تدرّب على الأسئلة الموثّقة',540,430,27,C.muted,'center',600);device(elapsed,'اختبر فهمك','أسئلة مرتبطة بصفحات الكتاب','exam');label('كل سؤال بخطوة')}
if(sc.k==='review'){txt('اختبر نفسك وراجع',540,350,58,C.ink);txt('ثبّت المعلومة على وقتك',540,430,27,C.muted,'center',600);device(elapsed,'مراجعة سريعة','جاوب، شوف النتيجة، وكمل','review');label('مراجعة على كيفك')}
if(sc.k==='progress'){txt('وكل خطوة محسوبة',540,350,58,C.ink);txt('تابع إنجازك صفحةً بعد صفحة',540,430,27,C.muted,'center',600);device(elapsed,'خطواتك صارت أوضح','تقدّمك الدراسي','progress');label('تقدّم تشوفه')}
if(sc.k==='end'){let sz=225+(1-p)*35;x.save();x.shadowColor='#55d4c455';x.shadowBlur=80;if(logo.complete)x.drawImage(logo,540-sz/2,600-sz/2,sz,sz);x.restore();txt('تحضيري',540,795,82,C.ink);round(130,920,820,4,2,C.brand);txt('ادرس بذكاء،',540,1080,63,C.ink);txt('وتقدّم بثقة.',540,1170,68,C.brand);txt('مستقبلك يبدأ من صفحة',540,1350,31,C.muted,'center',700);}
x.restore();raf=requestAnimationFrame(draw)}document.fonts.ready.then(()=>{start=performance.now();draw(start)});
function music(){const AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),dest=ac.createMediaStreamDestination(),master=ac.createGain();master.gain.value=.22;master.connect(dest);const notes=[110,164.81,220,164.81,130.81,196,261.63,196],t0=ac.currentTime;notes.forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t0+i*1.75);g.gain.linearRampToValueAtTime(.2,t0+i*1.75+.35);g.gain.exponentialRampToValueAtTime(.0001,t0+i*1.75+1.6);o.connect(g);g.connect(master);o.start(t0+i*1.75);o.stop(t0+i*1.75+1.7)});return{stream:dest.stream,ac}}
btn.onclick=async()=>{if(!window.MediaRecorder||!c.captureStream){status.textContent='استخدم Chrome لتصدير الفيديو';return}let mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));if(!mime){status.textContent='صيغة التصدير غير مدعومة في هذا المتصفح';return}btn.disabled=true;status.textContent='جاري التصدير — اترك الصفحة مفتوحة ٣٥ ثانية';let audio=music();await audio.ac.resume();let stream=new MediaStream([...c.captureStream(30).getVideoTracks(),...audio.stream.getAudioTracks()]),chunks=[],rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:12000000,audioBitsPerSecond:192000});start=performance.now();rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{let blob=new Blob(chunks,{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tahdiri-ad-02.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);stream.getTracks().forEach(t=>t.stop());audio.ac.close();btn.disabled=false;status.textContent=`اكتمل التصدير · ${(blob.size/1048576).toFixed(1)} MB · WebM 1080×1920`};rec.start(1000);setTimeout(()=>{if(rec.state==='recording')rec.stop()},D+100)};
})();
</script></body></html>
